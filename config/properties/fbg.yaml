tiering:
  method: gap_detection
  use_tiers_as_seasons: true
  require_listing_start_dates: true
  gap_score_basis: revpar_zscore
  smoothing_window_days: 14
  gap_threshold_pct: 6
  gap_threshold_zscore: 0.6
  min_tiers: 2
  max_tiers: 15
  quantile_fallback_tiers: 6
  min_days_per_tier: 14
  min_active_months_for_portfolio: 6

# Score-mode pricing matrix only (run_pricing_matrix when mode != tiered).
# month_score_by_index: manual 1–10 style strength per calendar month (overrides analysis CSV).
# Hierarchy (weak → strong): Jan < Jun < Sep < Jul=Aug < May < Nov < Dec < Oct=Feb < Apr < Mar
pricing:
  mode: score
  # Mon=Tue=Wed < Thu=Sun < Fri=Sat
  dow_hierarchy:
    - ["Monday", "Tuesday", "Wednesday"]
    - ["Thursday", "Sunday"]
    - ["Friday", "Saturday"]
  month_score_by_index:
    1: 1   # Jan — weakest
    2: 8   # Feb — same tier as Oct
    3: 10  # Mar — strongest
    4: 9   # Apr
    5: 5   # May
    6: 2   # Jun
    7: 4   # Jul — same as Aug
    8: 4   # Aug — same as Jul
    9: 3   # Sep
    10: 8  # Oct — same tier as Feb
    11: 6  # Nov
    12: 7  # Dec

  # Single listing ladder (weak → strong), same idea as month_score_by_index and dow_hierarchy.
  # Merges Basse 1 + Basse 2. Order tuned to median / night-weighted ADR in output/fbg/ingestion/canonical.csv
  # (esp. arrivals from 2025-07-01). Live Onera overrides can still price GLKR aggressively on some nights.
  listing_price_hierarchy:
    tiers:
      - order: 1
        id: haus
        unit_ids:
          - Pecan Haus
          - Juniper Haus
          - Cedar Haus
      - order: 2
        id: king_room
        unit_ids:
          - "Great Lodge: King Room"
      - order: 3
        id: entry
        unit_ids:
          - Post Oak
          - "Cypress Lodge | Sleeps 2"
      - order: 4
        id: soft
        unit_ids:
          - Bluebonnet
          - Lantana Dome
          - Sage Safari
          - Cocoon
          - Buckeye Bungalow
      - order: 5
        id: core
        unit_ids:
          - Spiral
          - "Cypress Lodge | Sleeps 4"
          - Winecup
          - Quonset
      - order: 6
        id: signature
        unit_ids:
          - "Cypress Lodge | Sleeps 6"
      - order: 7
        id: hard
        unit_ids:
          - Live Oak Lodge
          - Spyglass
          - Walnut House
      - order: 8
        id: elite
        unit_ids:
          - Monolith
          - Diamond
          - Monarch
      - order: 9
        id: buyout
        unit_ids:
          - Great Lodge
