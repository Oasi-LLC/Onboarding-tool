# Onera Fredericksburg — Cloudbeds (FBG). property_id `fbg` matches data/FBG/.
property_id: fbg
property_name: Onera Fredericksburg
pms_id: cloudbeds

# Keep only configured listing SKUs in canonical + analysis (drops historical
# Property-column buckets like OLD Track / OLD CB / Onera Fredericksburg — not units).
analysis_unit_filter: true

# Live data only — matches Historical Snapshot's onera.json tab name.
# Pre-2025 history still comes from the manually-maintained
# "Historical FBG (until 12_31_24).csv" file (same hybrid split Historical
# Snapshot uses for onera: legacy fixed file + live sheet tab). Add it under
# data/FBG/ and pass it alongside --from-sheets to get full history, e.g.:
#   python scripts/run_ingestion.py --property fbg --from-sheets "data/FBG/Historical FBG (until 12_31_24).csv"
data_source:
  type: google_sheets
  tab: "FBG_data"
# Total physical units (sum of positive unit_count in room_types; overlay SKUs with unit_count 0 are excluded).
# Great Lodge whole-property is not extra beds: it shares the 8 king-room units (see listing_unit_capacity_fallback).
# Cypress Sleeps 6: two combo units (each marketed as 4+2); still 2 physical addresses — counts stay 2 / SKU, not additive with Sleeps 2/4 pools in this model.
room_count: 37

analysis_window:
  start_date: "2025-01-01"
  # Inclusive filter on arrival_date for all analysis tables (keep full 2025 + 2026 in data).
  end_date: "2026-12-31"
  # YoY columns in overall_summary compare the same calendar span each year (avoids full 2025 vs partial 2026).
  # Move forward as 2026 fills in (e.g. 2026-05-31 after May closes). Basse 2 (from 2025-07-01) still appears in 2026 slice.
  yoy_compare_end_date: "2026-04-30"

# Combined month-of-year table only (monthly_performance_combined.csv). Does not change other analysis tables.
# Aligns rank basis with full 37-unit portfolio after Basse 2 go-live; caps forward pickup; flags thin latest-year months.
monthly_performance_combined:
  min_arrival_date: "2025-07-01"
  cap_max_arrival_at_today: true
  provisional_bookings_vs_hist_ratio: 0.6

# Whole-property Great Lodge uses the same 8 physical king rooms as Great Lodge: King Room (occupancy denominator).
listing_unit_capacity_fallback:
  Great Lodge: "Great Lodge: King Room"

# Cloudbeds FBG_data + historical rows use slightly different labels than room_types unit_id.
listing_name_map:
  "Cypress Lodge Sleeps 2": "Cypress Lodge | Sleeps 2"
  "Cypress Lodge Sleeps 4": "Cypress Lodge | Sleeps 4"
  "Cypress Lodge Sleeps 6": "Cypress Lodge | Sleeps 6"
  "Great Lodge King Room": "Great Lodge: King Room"

# Static inventory split (operational “Basse Type” / comma-joined rows can differ per stay).
listing_groups:
  - name: "Basse 1"
    unit_ids:
      - Bluebonnet
      - Buckeye Bungalow
      - Cedar Haus
      - Cocoon
      - Juniper Haus
      - Lantana Dome
      - Live Oak Lodge
      - Monarch
      - Pecan Haus
      - Sage Safari
      - Spyglass
      - Walnut House
  - name: "Basse 2"
    unit_ids:
      - "Cypress Lodge | Sleeps 2"
      - "Cypress Lodge | Sleeps 4"
      - "Cypress Lodge | Sleeps 6"
      - Diamond
      - Great Lodge
      - "Great Lodge: King Room"
      - Monolith
      - Post Oak
      - Quonset
      - Spiral
      - Winecup

# Basse 2 portfolio went live July 2025; Basse 1 predates that (use for tier / availability context).
